<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D HTML Mobile Shooter mit Sound</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI Overlays */
        .ui-element { position: absolute; color: white; text-shadow: 2px 2px 2px black; font-weight: bold; pointer-events: none; }
        #hud { top: 10px; left: 10px; font-size: 18px; }
        #mission-info { top: 10px; right: 10px; font-size: 18px; text-align: right; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Mobile Touch Controls */
        .joystick { position: absolute; bottom: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); pointer-events: auto; }
        #move-stick { left: 40px; width: 100px; height: 100px; }
        #look-stick { right: 40px; width: 100px; height: 100px; }
        #fire-btn { position: absolute; bottom: 160px; right: 50px; width: 70px; height: 70px; background: rgba(255, 0, 0, 0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; pointer-events: auto; }
        #shop-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #FFD700; color: black; border-radius: 5px; pointer-events: auto; font-size: 16px; }

        /* Shop Menu */
        #shop-menu { display: none; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; background: rgba(0,0,0,0.9); border: 2px solid #FFD700; color: white; pointer-events: auto; padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 10; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #444; }
        .buy-btn { padding: 5px 10px; background: green; color: white; border: none; border-radius: 3px; }
        .close-btn { background: red; color: white; padding: 5px 10px; float: right; border: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    
    <div id="hud" class="ui-element">
        Leben: <span id="hp-val">100</span> | Credits: <span id="credits-val">0</span>$<br>
        Waffe: <span id="weapon-val">Pistole</span>
    </div>
    
    <div id="mission-info" class="ui-element">
        Mission <span id="mission-num">1</span>/10<br>
        Ziel: Eliminiere alle Gegner (<span id="enemy-count">0</span> übrig)
    </div>

    <div id="move-stick" class="joystick"></div>
    <div id="look-stick" class="joystick"></div>
    <div id="fire-btn" class="ui-element">FEUER</div>
    <div id="shop-btn">WAFFEN-SHOP</div>

    <div id="shop-menu">
        <button class="close-btn" onclick="toggleShop()">X Schließen</button>
        <h2>Waffenschrank (Erkaufbare Upgrades)</h2>
        <div id="shop-list"></div>
    </div>

    <script>
        // --- WEB AUDIO API SOUND GENERATOR ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playShootSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playHitSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playPlayerHitSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playWinSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- SPIEL-DATEN ---
        const waffenListe = [
            { id: 0, name: "Pistole", schaden: 25, preis: 0, gekauft: true },
            { id: 1, name: "Schrotflinte", schaden: 60, preis: 150, gekauft: false },
            { id: 2, name: "Sturmgewehr AK", schaden: 40, preis: 300, gekauft: false },
            { id: 3, name: "Scharfschützengewehr", schaden: 120, preis: 600, gekauft: false },
            { id: 4, name: "Plasma-Werfer", schaden: 200, preis: 1200, gekauft: false }
        ];
        
        let aktuelleWaffe = waffenListe[0];
        let spieler = { hp: 100, credits: 0, mission: 1, lastDamageTime: 0 };
        
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x223344);
        scene.fog = new THREE.FogExp2(0x223344, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xfff1d0, 1.0);
        dirLight.position.set(-30, 60, 25);
        scene.add(dirLight);

        // --- VERBESSERTE SZENERIE ---
        const floorGeo = new THREE.PlaneGeometry(260, 260, 40, 40);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x315f28 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Sand-/Schotterweg
        const roadGeo = new THREE.PlaneGeometry(18, 240);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x756044 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.015;
        scene.add(road);

        // Felsen
        const rockMat = new THREE.MeshLambertMaterial({ color: 0x55585a });
        for(let i=0; i<45; i++) {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.7 + Math.random()*1.6, 0), rockMat);
            let x = Math.random()*230 - 115;
            let z = Math.random()*230 - 115;
            if(Math.abs(x) < 12) x += x < 0 ? -18 : 18;
            rock.position.set(x, 0.6, z);
            rock.scale.y = 0.5 + Math.random()*0.7;
            scene.add(rock);
        }

        // Bäume mit Stamm und Krone
        for(let i=0; i<70; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.35, 0.55, 4, 8),
                new THREE.MeshLambertMaterial({ color: 0x5b3922 })
            );
            const crown = new THREE.Mesh(
                new THREE.ConeGeometry(2.2 + Math.random()*1.3, 6, 8),
                new THREE.MeshLambertMaterial({ color: 0x174d25 })
            );
            trunk.position.y = 2;
            crown.position.y = 6;
            tree.add(trunk, crown);
            let x = Math.random()*230 - 115;
            let z = Math.random()*230 - 115;
            if(Math.abs(x) < 15) x += x < 0 ? -20 : 20;
            tree.position.set(x, 0, z);
            tree.rotation.y = Math.random()*Math.PI;
            scene.add(tree);
        }

        // Kleine Militärgebäude und Deckungen
        for(let i=0; i<12; i++) {
            const base = new THREE.Mesh(new THREE.BoxGeometry(7, 2.5, 6), new THREE.MeshLambertMaterial({color:0x566052}));
            const roof = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.6, 6.6), new THREE.MeshLambertMaterial({color:0x29352d}));
            const building = new THREE.Group();
            building.add(base, roof);
            base.position.y = 1.25;
            roof.position.y = 2.8;
            building.position.set(Math.random()*190-95,0,Math.random()*190-95);
            scene.add(building);
        }

        // Himmel etwas heller und atmosphärischer
        scene.background = new THREE.Color(0x55738a);
        scene.fog = new THREE.FogExp2(0x55738a, 0.008);

        camera.position.set(0, 2, 0);
        let rotationX = 0;
        let rotationY = 0;

        // --- SOLDATEN / GEGNER SYSTEM ---
        let gegnerArray = [];

        function erstelleSoldat() {
            const soldier = new THREE.Group();

            const uniformMat = new THREE.MeshLambertMaterial({ color: 0x3d5137 });
            const darkMat = new THREE.MeshLambertMaterial({ color: 0x202622 });
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xc58b68 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.65, 0.65), uniformMat);
            body.position.y = 1.65;
            soldier.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 10), skinMat);
            head.position.y = 2.75;
            soldier.add(head);

            const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.48, 12, 8, 0, Math.PI*2, 0, Math.PI/2), darkMat);
            helmet.position.y = 2.95;
            soldier.add(helmet);

            for(const side of [-1,1]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.35, 0.42), darkMat);
                leg.position.set(side*0.3, 0.55, 0);
                soldier.add(leg);
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.32, 1.25, 0.32), uniformMat);
                arm.position.set(side*0.82, 1.75, 0);
                arm.rotation.z = side * 0.22;
                soldier.add(arm);
            }

            // Gewehr in den Händen
            const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 1.9), darkMat);
            rifle.position.set(0.52, 1.65, -0.75);
            rifle.rotation.x = Math.PI/2;
            soldier.add(rifle);

            // Explizite Körperteile für saubere Animationen
            const legs = soldier.children.filter(x => x !== body && x.geometry && x.geometry.type === "BoxGeometry" && x.position.y < 1);
            const arms = soldier.children.filter(x => x !== body && x.geometry && x.geometry.type === "BoxGeometry" && x.position.y > 1.4);
            soldier.userData.parts = {
                body, head, helmet, uniformMat,
                leftLeg: legs[0],
                rightLeg: legs[1],
                leftArm: arms[0],
                rightArm: arms[1],
                rifle
            };
            soldier.userData.parts.leftLeg.name = "leftLeg";
            soldier.userData.parts.rightLeg.name = "rightLeg";
            soldier.userData.parts.leftArm.name = "leftArm";
            soldier.userData.parts.rightArm.name = "rightArm";
            soldier.userData.parts.rifle.name = "rifle";
            return soldier;
        }

        function erstelleGegner(anzahl) {
            gegnerArray.forEach(g => scene.remove(g.mesh));
            gegnerArray = [];

            for(let i=0; i<anzahl; i++) {
                const mesh = erstelleSoldat();
                mesh.position.set(Math.random()*120 - 60, 0, Math.random()*120 - 60);
                const distance = mesh.position.distanceTo(camera.position);
                if(distance < 15) mesh.position.z -= 25;
                scene.add(mesh);
                const verhalten = ["angreifer", "scharfschuetze", "flanker", "verteidiger"][Math.floor(Math.random()*4)];
                gegnerArray.push({
                    mesh,
                    material: mesh.userData.parts.uniformMat,
                    hp: 100 + (spieler.mission * 20),
                    maxHp: 100 + (spieler.mission * 20),
                    flashTimer: 0,
                    attackCooldown: Math.random()*1.5,
                    animTime: Math.random()*10,
                    walkPhase: Math.random()*Math.PI*2,
                    dying: false,
                    deathTime: 0,
                    muzzleTime: 0,
                    shotCooldown: 1.0 + Math.random()*2.5,
                    verhalten,
                    spawnPosition: mesh.position.clone(),
                    strafeDir: Math.random() < 0.5 ? -1 : 1,
                    strafeTimer: 1 + Math.random()*2,
                    lastPlayerShot: 0
                });
            }
            ausgebenUI();
        }

        // --- STEUERUNG ---
        let moveInput = { x: 0, y: 0 };
        let lookInput = { x: 0, y: 0 };

        document.getElementById('move-stick').addEventListener('touchmove', (e) => {
            let touch = e.touches[0];
            let rect = e.target.getBoundingClientRect();
            moveInput.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            moveInput.y = -(((touch.clientY - rect.top) / rect.height) * 2 - 1);
        });
        document.getElementById('move-stick').addEventListener('touchend', () => moveInput = { x: 0, y: 0 });

        document.getElementById('look-stick').addEventListener('touchmove', (e) => {
            let touch = e.touches[0];
            let rect = e.target.getBoundingClientRect();
            lookInput.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            lookInput.y = -(((touch.clientY - rect.top) / rect.height) * 2 - 1);
        });
        document.getElementById('look-stick').addEventListener('touchend', () => lookInput = { x: 0, y: 0 });

        document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            feuerWaffe();
        });

        function feuerWaffe() {
            playShootSound();
            // Kleine Rückstoßanimation der Kamera
            rotationX = Math.min(Math.PI/3, rotationX + 0.025);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            
            const intersects = raycaster.intersectObjects(gegnerArray.map(g => g.mesh), true);
            
            if(intersects.length > 0) {
                let getroffenMesh = intersects[0].object;
                let gegner = gegnerArray.find(g => g.mesh === getroffenMesh || g.mesh.getObjectById(getroffenMesh.id));
                
                if(gegner) {
                    playHitSound();
                    gegner.hp -= aktuelleWaffe.schaden;
                    gegner.mesh.userData.parts.uniformMat.color.setHex(0xffffff); // Treffer-Feedback
                    gegner.flashTimer = 0.1;
                    
                    if(gegner.hp <= 0 && !gegner.dying) {
                        // Todesanimation statt sofortigem Entfernen
                        gegner.dying = true;
                        gegner.deathTime = 0;
                        gegner.mesh.userData.deathAwarded = false;
                    }
                }
            }
            ausgebenUI();
        }

        function ueberpruefeMission() {
            if(gegnerArray.length === 0) {
                playWinSound();
                if(spieler.mission < 10) {
                    spieler.mission++;
                    alert(`Mission ${spieler.mission - 1} abgeschlossen! Belohnung: 200$. Nächste Mission startet.`);
                    spieler.credits += 200;
                    starteMission();
                } else {
                    alert("Herzlichen Glückwunsch! Du hast das Spiel komplett durchgespielt!");
                    spieler.mission = 1;
                    starteMission();
                }
            }
        }

        function starteMission() {
            erstelleGegner(2 + spieler.mission);
        }

        function ausgebenUI() {
            document.getElementById('hp-val').innerText = spieler.hp;
            document.getElementById('credits-val').innerText = spieler.credits;
            document.getElementById('weapon-val').innerText = aktuelleWaffe.name;
            document.getElementById('mission-num').innerText = spieler.mission;
            document.getElementById('enemy-count').innerText = gegnerArray.length;
        }

        function toggleShop() {
            const menu = document.getElementById('shop-menu');
            const sichtbar = menu.style.display === 'block';
            menu.style.display = sichtbar ? 'none' : 'block';
            if(!sichtbar) renderShop();
        }
        document.getElementById('shop-btn').addEventListener('click', toggleShop);

        function renderShop() {
            const list = document.getElementById('shop-list');
            list.innerHTML = "";
            waffenListe.forEach(w => {
                let div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <span><b>${w.name}</b> (Schaden: ${w.schaden})</span>
                    <span>${w.gekauft ? 'Bereits im Besitz' : w.preis + '$'} 
                    <button class="buy-btn" onclick="kaufeWaffe(${w.id})">${w.gekauft && aktuelleWaffe.id === w.id ? 'Ausgewählt' : (w.gekauft ? 'Auswählen' : 'Kaufen')}</button></span>
                `;
                list.appendChild(div);
            });
        }

        window.kaufeWaffe = function(id) {
            let waffe = waffenListe.find(w => w.id === id);
            if(waffe.gekauft) {
                aktuelleWaffe = waffe;
            } else if(spieler.credits >= waffe.preis) {
                spieler.credits -= waffe.preis;
                waffe.gekauft = true;
                aktuelleWaffe = waffe;
            } else {
                alert("Nicht genug Credits!");
            }
            toggleShop();
            ausgebenUI();
        }

        // --- GAME LOOP ---
        const velocity = new THREE.Vector3();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if(spieler.lastDamageTime > 0) {
                spieler.lastDamageTime -= delta;
                document.getElementById('hud').style.transform = Math.sin(spieler.lastDamageTime * 55) * 3 + 'px';
            } else {
                document.getElementById('hud').style.transform = 'translateX(0)';
            }

            rotationY -= lookInput.x * 0.03;
            rotationX += lookInput.y * 0.03;
            rotationX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotationX));
            camera.quaternion.setFromEuler(new THREE.Euler(rotationX, rotationY, 0, 'YXZ'));

            velocity.set(moveInput.x, 0, -moveInput.y).normalize();
            velocity.applyQuaternion(camera.quaternion);
            velocity.y = 0;
            camera.position.addScaledVector(velocity, delta * 12);

            gegnerArray.forEach(g => {
                // Treffer-Blinken zurücksetzen
                if(g.flashTimer > 0) {
                    g.flashTimer -= delta;
                    if(g.flashTimer <= 0) g.material.color.setHex(0x3d5137);
                }

                // Unterschiedliche KI-Verhalten
                g.animTime += delta;

                const parts = g.mesh.userData.parts;
                const walk = Math.sin(g.animTime * (5.5 + spieler.mission * 0.1) + g.walkPhase) * 0.55;

                // Treffer-Blinken zurücksetzen
                if(g.flashTimer > 0) {
                    g.flashTimer -= delta;
                    if(g.flashTimer <= 0) g.material.color.setHex(0x3d5137);
                }

                // Todesanimation
                if(g.dying) {
                    g.deathTime += delta;
                    const t = Math.min(g.deathTime / 0.65, 1);
                    g.mesh.rotation.x = -t * Math.PI * 0.48;
                    g.mesh.position.y = -0.45 * t;

                    if(t >= 1 && !g.mesh.userData.deathAwarded) {
                        g.mesh.userData.deathAwarded = true;
                        scene.remove(g.mesh);
                        gegnerArray = gegnerArray.filter(x => x !== g);
                        spieler.credits += 50 * spieler.mission;
                        ueberpruefeMission();
                    }
                    return;
                }

                // Laufanimation
                if(parts.leftArm && parts.rightArm) {
                    parts.leftArm.rotation.z = -0.22 + walk * 0.45;
                    parts.rightArm.rotation.z = 0.22 - walk * 0.45;
                }
                if(parts.leftLeg && parts.rightLeg) {
                    parts.leftLeg.rotation.x = walk * 0.65;
                    parts.rightLeg.rotation.x = -walk * 0.65;
                }

                let richtung = new THREE.Vector3().subVectors(camera.position, g.mesh.position);
                richtung.y = 0;
                const dist = richtung.length();

                // Verhalten 1: Angreifer - rennt direkt auf den Spieler zu
                // Verhalten 2: Scharfschütze - hält Abstand und schießt aus der Distanz
                // Verhalten 3: Flanker - versucht seitlich um den Spieler herumzukommen
                // Verhalten 4: Verteidiger - bleibt eher bei seinem Startgebiet und greift dort an
                let ziel = new THREE.Vector3();

                if(g.verhalten === "angreifer") {
                    ziel.copy(camera.position);
                    if(dist > 6) {
                        richtung.normalize();
                        g.mesh.position.addScaledVector(richtung, delta * (2.0 + spieler.mission * 0.12));
                    }
                } else if(g.verhalten === "scharfschuetze") {
                    if(dist < 16) {
                        richtung.normalize();
                        g.mesh.position.addScaledVector(richtung, -delta * 1.0);
                    } else if(dist > 28) {
                        richtung.normalize();
                        g.mesh.position.addScaledVector(richtung, delta * 0.8);
                    } else {
                        // Kleine seitliche Positionsänderungen, damit der Scharfschütze nicht stillsteht
                        const side = new THREE.Vector3(-richtung.z, 0, richtung.x).multiplyScalar(g.strafeDir);
                        g.strafeTimer -= delta;
                        if(g.strafeTimer <= 0) {
                            g.strafeDir *= -1;
                            g.strafeTimer = 1.5 + Math.random()*2;
                        }
                        g.mesh.position.addScaledVector(side, delta * 0.35);
                    }
                } else if(g.verhalten === "flanker") {
                    const side = new THREE.Vector3(-richtung.z, 0, richtung.x).multiplyScalar(g.strafeDir);
                    if(dist > 10) {
                        richtung.normalize();
                        ziel.copy(richtung).multiplyScalar(0.55).add(side.normalize().multiplyScalar(0.8)).normalize();
                        g.mesh.position.addScaledVector(ziel, delta * 1.55);
                    } else {
                        g.strafeTimer -= delta;
                        if(g.strafeTimer <= 0) {
                            g.strafeDir *= -1;
                            g.strafeTimer = 1 + Math.random()*1.5;
                        }
                        g.mesh.position.addScaledVector(side.normalize(), delta * 1.0 * g.strafeDir);
                    }
                } else {
                    // Verteidiger: bewegt sich nur begrenzt vom Spawnpunkt weg
                    const homeDir = new THREE.Vector3().subVectors(g.spawnPosition, g.mesh.position);
                    if(homeDir.length() > 9) {
                        homeDir.normalize();
                        g.mesh.position.addScaledVector(homeDir, delta * 1.2);
                    } else if(dist < 13) {
                        richtung.normalize();
                        g.mesh.position.addScaledVector(richtung, -delta * 0.8);
                    }
                }

                // Immer zum Spieler drehen, wenn er in Reichweite ist.
                const lookDir = new THREE.Vector3().subVectors(camera.position, g.mesh.position);
                lookDir.y = 0;
                if(lookDir.lengthSq() > 0.01) {
                    g.mesh.rotation.y = Math.atan2(lookDir.x, lookDir.z);
                }

                // Waffenhaltung: nah = Anschlag, sonst normale Laufhaltung
                const schussReichweite = g.verhalten === "scharfschuetze" ? 42 :
                                         g.verhalten === "verteidiger" ? 30 : 24;

                if(dist < schussReichweite) {
                    if(parts.leftArm && parts.rightArm) {
                        parts.leftArm.rotation.z = -0.72;
                        parts.rightArm.rotation.z = 0.72;
                    }
                    if(parts.leftLeg && parts.rightLeg) {
                        parts.leftLeg.rotation.x = 0;
                        parts.rightLeg.rotation.x = 0;
                    }

                    // Soldaten schießen jetzt wirklich auf den Spieler.
                    g.shotCooldown -= delta;
                    if(g.shotCooldown <= 0 && dist > 5) {
                        const cooldownBase = g.verhalten === "scharfschuetze" ? 2.2 :
                                             g.verhalten === "angreifer" ? 1.0 : 1.5;
                        g.shotCooldown = cooldownBase + Math.random()*1.2;
                        g.muzzleTime = 0.10;
                        playShootSound();

                        const flash = new THREE.Mesh(
                            new THREE.SphereGeometry(0.13, 6, 6),
                            new THREE.MeshBasicMaterial({color: 0xffcc55})
                        );
                        flash.position.set(0.52, 1.65, -1.72);
                        g.mesh.add(flash);
                        g.muzzleFlash = flash;

                        if(parts.rifle) parts.rifle.position.z = -0.9;

                        // Trefferchance abhängig vom Soldatentyp und der Entfernung.
                        const accuracyBase = g.verhalten === "scharfschuetze" ? 0.88 :
                                             g.verhalten === "angreifer" ? 0.48 : 0.65;
                        const distancePenalty = Math.min(dist / 70, 0.30);
                        const hitChance = Math.max(0.25, accuracyBase - distancePenalty);

                        if(Math.random() < hitChance) {
                            const damage = g.verhalten === "scharfschuetze" ? 12 :
                                           g.verhalten === "angreifer" ? 7 : 9;
                            spieler.hp = Math.max(0, spieler.hp - damage);
                            spieler.lastDamageTime = 0.18;
                            playPlayerHitSound();
                            ausgebenUI();

                            if(spieler.hp <= 0) {
                                spieler.hp = 0;
                                ausgebenUI();
                                setTimeout(() => {
                                    if(spieler.hp <= 0) {
                                        alert("Du wurdest von den Soldaten eliminiert! Die Mission startet neu.");
                                        spieler.hp = 100;
                                        starteMission();
                                        ausgebenUI();
                                    }
                                }, 250);
                            }
                        }
                    }

                    if(g.muzzleTime > 0) {
                        g.muzzleTime -= delta;
                        if(g.muzzleFlash) {
                            g.muzzleFlash.scale.setScalar(1 + Math.random()*0.7);
                            g.muzzleFlash.visible = true;
                        }
                        if(g.muzzleTime <= 0) {
                            if(g.muzzleFlash) {
                                g.mesh.remove(g.muzzleFlash);
                                g.muzzleFlash = null;
                            }
                            if(parts.rifle) parts.rifle.position.z = -0.75;
                        }
                    }
                }

                // Nahkampfschaden nur bei sehr kurzer Distanz
                if(dist < 2.2) {
                    g.attackCooldown -= delta;
                    if(g.attackCooldown <= 0) {
                        spieler.hp = Math.max(0, spieler.hp - 4);
                        g.attackCooldown = 1.0;
                        playPlayerHitSound();
                        ausgebenUI();

                        if(spieler.hp <= 0) {
                            alert("Du wurdest im Nahkampf eliminiert! Die Mission startet neu.");
                            spieler.hp = 100;
                            starteMission();
                            ausgebenUI();
                        }
                    }
                }
            });

            renderer.render(scene, camera);
        }

        starteMission();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
