<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D HTML Mobile Shooter mit Sound</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI Overlays */
        .ui-element { position: absolute; color: white; text-shadow: 2px 2px 2px black; font-weight: bold; pointer-events: none; }
        #hud { top: 10px; left: 10px; font-size: 18px; }
        #mission-info { top: 10px; right: 10px; font-size: 18px; text-align: right; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Mobile Touch Controls */
        .joystick { position: absolute; bottom: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); pointer-events: auto; }
        #move-stick { left: 40px; width: 100px; height: 100px; }
        #look-stick { right: 40px; width: 100px; height: 100px; }
        #fire-btn { position: absolute; bottom: 160px; right: 50px; width: 70px; height: 70px; background: rgba(255, 0, 0, 0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; pointer-events: auto; }
        #shop-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #FFD700; color: black; border-radius: 5px; pointer-events: auto; font-size: 16px; }
        #level-btn { position: absolute; top: 70px; left: 10px; padding: 10px 16px; background: rgba(30,120,210,0.9); color: white; border-radius: 6px; pointer-events: auto; font-weight: bold; z-index: 5; }
        #level-menu { display:none; position:absolute; top:5%; left:5%; width:90%; height:90%; background:rgba(8,12,14,0.96); border:2px solid #4aa3df; color:white; pointer-events:auto; padding:16px; box-sizing:border-box; overflow-y:auto; z-index:20; }
        #level-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .level-card { background:linear-gradient(145deg,#263238,#111); border:1px solid #566; border-radius:8px; padding:12px; min-height:78px; }
        .level-card button { margin-top:8px; width:100%; padding:9px; border:0; border-radius:5px; background:#2e8b57; color:white; font-weight:bold; }
        .level-card small { color:#bfc8cc; }


        /* Shop Menu */
        #shop-menu { display: none; position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; background: rgba(0,0,0,0.9); border: 2px solid #FFD700; color: white; pointer-events: auto; padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 10; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #444; }
        .buy-btn { padding: 5px 10px; background: green; color: white; border: none; border-radius: 3px; }
        .close-btn { background: red; color: white; padding: 5px 10px; float: right; border: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    
    <div id="hud" class="ui-element">
        Leben: <span id="hp-val">100</span> | Credits: <span id="credits-val">0</span>$<br>
        Waffe: <span id="weapon-val">Pistole</span><br>
        <span id="cover-status"></span>
    </div>
    
    <div id="mission-info" class="ui-element">
        Mission <span id="mission-num">1</span>/10<br>
        Ziel: <span id="objective-text">Eliminiere alle Gegner</span>
    </div>

    <div id="move-stick" class="joystick"></div>
    <div id="look-stick" class="joystick"></div>
    <div id="fire-btn" class="ui-element">FEUER</div>
    <div id="level-btn">LEVEL</div>
    <div id="shop-btn">WAFFEN-SHOP</div>

    <div id="level-menu">
        <button class="close-btn" onclick="toggleLevelMenu()">X Schließen</button>
        <h2>🎯 Level auswählen</h2>
        <p>Wähle direkt eine der 10 Einsatzmissionen.</p>
        <div id="level-grid"></div>
    </div>

    <div id="shop-menu">
        <button class="close-btn" onclick="toggleShop()">X Schließen</button>
        <h2>Waffenschrank (Erkaufbare Upgrades)</h2>
        <div id="shop-list"></div>
    </div>

    <script>
        // --- WEB AUDIO API SOUND GENERATOR ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playShootSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playHitSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playPlayerHitSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playWinSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- SPIEL-DATEN ---
        const waffenListe = [
            { id: 0, name: "Pistole", schaden: 25, preis: 0, gekauft: true },
            { id: 1, name: "Schrotflinte", schaden: 60, preis: 150, gekauft: false },
            { id: 2, name: "Sturmgewehr AK", schaden: 40, preis: 300, gekauft: false },
            { id: 3, name: "Scharfschützengewehr", schaden: 120, preis: 600, gekauft: false },
            { id: 4, name: "Plasma-Werfer", schaden: 200, preis: 1200, gekauft: false }
        ];
        
        let aktuelleWaffe = waffenListe[0];
        let spieler = { hp: 100, credits: 0, mission: 1, lastDamageTime: 0 };
        
        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x223344);
        scene.fog = new THREE.FogExp2(0x223344, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xfff1d0, 1.0);
        dirLight.position.set(-30, 60, 25);
        scene.add(dirLight);

        // --- MISSIONS-SZENERIEN ---
        let szenerieGruppe = new THREE.Group();
        scene.add(szenerieGruppe);

        // Begehbare Gebäude: nur Wände blockieren den Spieler, die Türen bleiben offen.
        let weltKollisionsobjekte = [];
        const weltRaycaster = new THREE.Raycaster();

        function registriereWand(wand) {
            wand.userData.istGebaeudeWand = true;
            weltKollisionsobjekte.push(wand);
            szenerieGruppe.add(wand);
            return wand;
        }

        function istSichtkontakt(start, ziel) {
            if(weltKollisionsobjekte.length === 0) return true;
            const richtung = new THREE.Vector3().subVectors(ziel, start);
            const entfernung = richtung.length();
            if(entfernung < 0.1) return true;
            richtung.normalize();
            weltRaycaster.set(start, richtung);
            const treffer = weltRaycaster.intersectObjects(weltKollisionsobjekte, false);
            return treffer.length === 0 || treffer[0].distance > entfernung - 0.35;
        }

        // Türen und Treppen für mehrstöckige, begehbare Gebäude.
        let begehbareTreppen = [];
        let gebaeudeTuerObjekte = [];

        function baueTuer(x,y,z,breite=2.6,hoehe=2.8,rotationY=0) {
            // Tür mit echter Scharnierbewegung. Solange sie geschlossen ist,
            // blockiert sie den Eingang; beim Näherkommen öffnet sie automatisch.
            const pivot = new THREE.Group();
            pivot.position.set(x-breite/2, y, z);
            pivot.rotation.y = rotationY;
            
            const tuer = new THREE.Mesh(
                new THREE.BoxGeometry(breite, hoehe, 0.18),
                new THREE.MeshLambertMaterial({color:0x30251d})
            );
            tuer.position.set(breite/2, hoehe/2, 0);
            tuer.castShadow = true;
            pivot.add(tuer);
            szenerieGruppe.add(pivot);
            
            gebaeudeTuerObjekte.push({
                pivot:pivot,
                mesh:tuer,
                hinge:new THREE.Vector3(x-breite/2, y, z),
                breite:breite,
                zielOffen:false,
                offen:false,
                collisionAdded:true
            });
            weltKollisionsobjekte.push(tuer);
            return tuer;
        }

        function aktualisiereTueren() {
            let meldung = '';
            for(const t of gebaeudeTuerObjekte) {
                const dx = camera.position.x - t.hinge.x;
                const dz = camera.position.z - t.hinge.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                
                // Ab 5 Metern öffnet die Tür, ab 7 Metern schließt sie wieder.
                if(dist < 5.2) {
                    t.zielOffen = true;
                } else if(dist > 7.0) {
                    t.zielOffen = false;
                }
                
                const zielWinkel = t.zielOffen ? -Math.PI/2 : 0;
                const aktuellerWinkel = t.pivot.rotation.y;
                const schritt = 0.16;
                t.pivot.rotation.y += (zielWinkel - aktuellerWinkel) * schritt;
                
                const istOffen = Math.abs(zielWinkel - t.pivot.rotation.y) < 0.12;
                if(istOffen && t.zielOffen) {
                    t.offen = true;
                    if(t.collisionAdded) {
                        const index = weltKollisionsobjekte.indexOf(t.mesh);
                        if(index !== -1) weltKollisionsobjekte.splice(index,1);
                        t.collisionAdded = false;
                    }
                    if(dist < 5.2) meldung = '🚪 TÜR ÖFFNET SICH';
                } else if(!t.zielOffen && Math.abs(t.pivot.rotation.y) < 0.12) {
                    t.offen = false;
                    if(!t.collisionAdded) {
                        weltKollisionsobjekte.push(t.mesh);
                        t.collisionAdded = true;
                    }
                }
            }
            
            // Nur anzeigen, wenn gerade eine Tür geöffnet wird.
            const status = document.getElementById('cover-status');
            if(meldung) {
                status.innerText = meldung;
                status.style.color = '#ffd54a';
                clearTimeout(window.tuerMeldungsTimer);
                window.tuerMeldungsTimer = setTimeout(() => {
                    ausgebenUI();
                }, 900);
            }
        }

        function baueTreppe(x,z,hoehe,richtung=1) {
            const treppe=new THREE.Group();
            const stufen=Math.max(6,Math.floor(hoehe/0.45));
            for(let i=0;i<stufen;i++) {
                const stufe=new THREE.Mesh(
                    new THREE.BoxGeometry(2.4,0.35,1.0),
                    new THREE.MeshLambertMaterial({color:0x55514b})
                );
                stufe.position.set(x,0.25+i*0.42,z+richtung*i*0.72);
                treppe.add(stufe);
            }
            szenerieGruppe.add(treppe);
            begehbareTreppen.push({x,z,richtung,hoehe,breite:2.4,laenge:stufen*0.72});
        }

        function aktualisiereTreppen() {
            for(const t of begehbareTreppen) {
                const dx=camera.position.x-t.x;
                const dz=(camera.position.z-t.z)*t.richtung;
                if(Math.abs(dx)<t.breite/2 && dz>-0.5 && dz<t.laenge+0.5) {
                    const stufe=Math.max(0,Math.min(Math.floor(dz/0.72),Math.floor(t.hoehe/0.42)));
                    camera.position.y=2+stufe*0.42;
                    return true;
                }
            }
            return false;
        }

        function spielerIstInGebaeude() {
            for(const objekt of weltKollisionsobjekte) {
                const box = new THREE.Box3().setFromObject(objekt);
                if(camera.position.x > box.min.x - 0.35 &&
                   camera.position.x < box.max.x + 0.35 &&
                   camera.position.z > box.min.z - 0.35 &&
                   camera.position.z < box.max.z + 0.35) return true;
            }
            return false;
        }

        function korrigiereGebaeudeKollision(vorherX, vorherZ) {
            const spielerRadius = 0.55;
            for(const objekt of weltKollisionsobjekte) {
                const box = new THREE.Box3().setFromObject(objekt);
                if(camera.position.x > box.min.x - spielerRadius &&
                   camera.position.x < box.max.x + spielerRadius &&
                   camera.position.z > box.min.z - spielerRadius &&
                   camera.position.z < box.max.z + spielerRadius) {
                    camera.position.x = vorherX;
                    camera.position.z = vorherZ;
                    return;
                }
            }
        }

        // Begehbare Versteck-Gebäude für alle Einsatzgebiete außer der bereits bebauten Ruinenstadt.
        function baueVersteckGebaeude(x, z, w, d, h, farbe, dachFarbe) {
            const wandMat = new THREE.MeshLambertMaterial({color:farbe});
            const dachMat = new THREE.MeshLambertMaterial({color:dachFarbe});
            const bodenMat = new THREE.MeshLambertMaterial({color:0x343634});
            const tuerBreite = Math.min(2.8, w * 0.34);
            const dicke = 0.42;
            const boden = new THREE.Mesh(new THREE.BoxGeometry(w,0.22,d),bodenMat);
            boden.position.set(x,0.11,z);
            szenerieGruppe.add(boden);

            const links = new THREE.Mesh(new THREE.BoxGeometry(dicke,h,d),wandMat);
            links.position.set(x-w/2,h/2,z);
            registriereWand(links);
            const rechts = links.clone();
            rechts.position.x=x+w/2;
            registriereWand(rechts);
            const rueck = new THREE.Mesh(new THREE.BoxGeometry(w,h,dicke),wandMat);
            rueck.position.set(x,h/2,z-d/2);
            registriereWand(rueck);

            const segmentBreite=(w-tuerBreite)/2;
            const frontLinks=new THREE.Mesh(new THREE.BoxGeometry(segmentBreite,h,dicke),wandMat);
            frontLinks.position.set(x-(tuerBreite/2+segmentBreite/2),h/2,z+d/2);
            registriereWand(frontLinks);
            const frontRechts=frontLinks.clone();
            frontRechts.position.x=x+(tuerBreite/2+segmentBreite/2);
            registriereWand(frontRechts);
            const rahmen=new THREE.Mesh(new THREE.BoxGeometry(tuerBreite,0.5,dicke),wandMat);
            rahmen.position.set(x,h-0.25,z+d/2);
            registriereWand(rahmen);

            const dach=new THREE.Mesh(new THREE.BoxGeometry(w+0.5,0.35,d+0.5),dachMat);
            dach.position.set(x,h+0.18,z);
            szenerieGruppe.add(dach);

            const kisteMat=new THREE.MeshLambertMaterial({color:0x5b4932});
            for(let i=0;i<2;i++) {
                const kiste=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.0,1.5),kisteMat);
                kiste.position.set(x-w*0.22+i*w*0.44,0.5,z-d*0.15);
                szenerieGruppe.add(kiste);
            }
            baueTuer(x,0,z+d/2+0.08,tuerBreite,h,0);
        }

        const missionsSzenerien = [
            {name:"Militärwald", boden:0x315f28, himmel:0x55738a, nebel:0.008, objekt:"wald"},
            {name:"Urwald", boden:0x164d20, himmel:0x3f6870, nebel:0.012, objekt:"urwald"},
            {name:"Wüste", boden:0x9b7a45, himmel:0xc99d68, nebel:0.006, objekt:"wueste"},
            {name:"Schneegebirge", boden:0xcbd5d8, himmel:0x8fa8bb, nebel:0.010, objekt:"schnee"},
            {name:"Sumpf", boden:0x30452b, himmel:0x53685b, nebel:0.014, objekt:"sumpf"},
            {name:"Felsenschlucht", boden:0x5c5148, himmel:0x71818b, nebel:0.008, objekt:"fels"},
            {name:"Küste", boden:0x6b8060, himmel:0x4f88a5, nebel:0.006, objekt:"kueste"},
            {name:"Vulkanland", boden:0x352c29, himmel:0x493536, nebel:0.010, objekt:"vulkan"},
            {name:"Ruinenstadt", boden:0x55534e, himmel:0x6b7074, nebel:0.009, objekt:"stadt"},
            {name:"Nachtbasis", boden:0x17251e, himmel:0x101a25, nebel:0.012, objekt:"nacht"}
        ];

        function baueSzenerie(missionsNummer) {
            weltKollisionsobjekte = [];
            begehbareTreppen = [];
            gebaeudeTuerObjekte = [];
            while(szenerieGruppe.children.length) {
                const kind = szenerieGruppe.children.pop();
                kind.traverse(o => {
                    if(o.geometry) o.geometry.dispose();
                    if(o.material) {
                        if(Array.isArray(o.material)) o.material.forEach(m => m.dispose());
                        else o.material.dispose();
                    }
                });
            }

            const daten = missionsSzenerien[(missionsNummer - 1) % missionsSzenerien.length];
            const seed = missionsNummer * 7919;
            function zufall(i) {
                const x = Math.sin(seed + i * 127.1) * 43758.5453;
                return x - Math.floor(x);
            }
            scene.background = new THREE.Color(daten.himmel);
            scene.fog = new THREE.FogExp2(daten.himmel, daten.nebel);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(260, 260),
                new THREE.MeshLambertMaterial({color:daten.boden})
            );
            floor.rotation.x = -Math.PI / 2;
            szenerieGruppe.add(floor);

            // Jedes Level bekommt eigene begehbare Gebäude zum Verstecken.
            if(daten.objekt !== "stadt") {
                const gebaeudeFarben = {
                    wald:[0x3f493d,0x29302a], urwald:[0x4a3b2b,0x252d25],
                    wueste:[0x8a6a45,0x51412f], schnee:[0x70797b,0x4b5355],
                    sumpf:[0x3d4a3d,0x29332c], fels:[0x5a5149,0x373431],
                    kueste:[0x566052,0x39463e], vulkan:[0x4b3f3b,0x282323],
                    nacht:[0x26352c,0x171d1a]
                };
                const farben=gebaeudeFarben[daten.objekt] || [0x4b4b47,0x30302d];
                const pos=[[-38,-34],[38,34],[-42,38]];
                for(let i=0;i<pos.length;i++) {
                    const px=pos[i][0]+(zufall(5000+i)-0.5)*8;
                    const pz=pos[i][1]+(zufall(5100+i)-0.5)*8;
                    baueVersteckGebaeude(px,pz,10+zufall(5200+i)*4,8+zufall(5300+i)*4,4.5+zufall(5400+i)*1.5,farben[0],farben[1]);
                }
            }

            // Jede Mission bekommt einen anderen Grundaufbau.
            if(daten.objekt === "wald" || daten.objekt === "urwald" || daten.objekt === "sumpf" || daten.objekt === "nacht") {
                const treeCount = daten.objekt === "urwald" ? 115 : 70;
                for(let i=0; i<treeCount; i++) {
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.25 + Math.random()*0.25, 0.45 + Math.random()*0.35, 3 + Math.random()*3, 7),
                        new THREE.MeshLambertMaterial({color:daten.objekt === "urwald" ? 0x3a2a19 : 0x5b3922})
                    );
                    const crown = new THREE.Mesh(
                        new THREE.ConeGeometry(
                            daten.objekt === "urwald" ? 2.5 + Math.random()*2.0 : 2.0 + Math.random()*1.5,
                            daten.objekt === "urwald" ? 7 + Math.random()*5 : 5 + Math.random()*2,
                            8
                        ),
                        new THREE.MeshLambertMaterial({color:
                            daten.objekt === "nacht" ? 0x12351f :
                            daten.objekt === "sumpf" ? 0x244c28 :
                            daten.objekt === "urwald" ? 0x0d5a28 : 0x174d25})
                    );
                    trunk.position.y = 1.8;
                    crown.position.y = 5.5;
                    tree.add(trunk,crown);
                    tree.position.set(zufall(i)*230-115,0,Math.random()*230-115);
                    if(Math.abs(tree.position.x) < 13) tree.position.x += tree.position.x < 0 ? -20 : 20;
                    szenerieGruppe.add(tree);
                }
            }

            if(daten.objekt === "urwald") {
                for(let i=0; i<45; i++) {
                    const vine = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.08,0.14,5+Math.random()*5,6),
                        new THREE.MeshLambertMaterial({color:0x1f6b31})
                    );
                    vine.position.set(zufall(i+300)*220-110,3+Math.random()*3,Math.random()*220-110);
                    vine.rotation.z = (Math.random()-0.5)*0.7;
                    szenerieGruppe.add(vine);
                }
            }

            if(daten.objekt === "wueste" || daten.objekt === "fels" || daten.objekt === "vulkan" || daten.objekt === "kueste") {
                for(let i=0; i<65; i++) {
                    const rock = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(0.8+Math.random()*2.4,0),
                        new THREE.MeshLambertMaterial({color:
                            daten.objekt === "wueste" ? 0x80623e :
                            daten.objekt === "vulkan" ? 0x3b3431 : 0x55585a})
                    );
                    rock.position.set(Math.random()*230-115,0.7,Math.random()*230-115);
                    rock.scale.y = 0.4+Math.random()*1.0;
                    szenerieGruppe.add(rock);
                }
            }

            if(daten.objekt === "schnee") {
                for(let i=0; i<28; i++) {
                    const mountain = new THREE.Mesh(
                        new THREE.ConeGeometry(7+Math.random()*9,18+Math.random()*20,7),
                        new THREE.MeshLambertMaterial({color:0x8f999c})
                    );
                    mountain.position.set(zufall(i+500)*240-120,9,Math.random()*230-115);
                    szenerieGruppe.add(mountain);
                }
                for(let i=0; i<55; i++) {
                    const tree = new THREE.Mesh(
                        new THREE.ConeGeometry(1.8+Math.random(),5+Math.random()*3,8),
                        new THREE.MeshLambertMaterial({color:0x365544})
                    );
                    tree.position.set(Math.random()*220-110,2.5,Math.random()*220-110);
                    szenerieGruppe.add(tree);
                }
            }

            if(daten.objekt === "stadt") {
                // Ruinenstadt mit echten Innenräumen, Türen und Deckung.
                for(let i=0; i<18; i++) {
                    const w = 9 + zufall(i+700) * 5;
                    const d = 8 + zufall(i+800) * 5;
                    const h = 4 + zufall(i+900) * 9;
                    const x = zufall(i+1000) * 190 - 95;
                    const z = zufall(i+1100) * 190 - 95;
                    if(Math.abs(x) < 15 && Math.abs(z) < 15) continue;

                    const gebaeude = new THREE.Group();
                    gebaeude.position.set(x, 0, z);

                    const wandMaterial = new THREE.MeshLambertMaterial({color:0x4c4d4a});
                    const innenMaterial = new THREE.MeshLambertMaterial({color:0x343633});
                    const boden = new THREE.Mesh(
                        new THREE.BoxGeometry(w, 0.25, d),
                        innenMaterial
                    );
                    boden.position.y = 0.12;
                    gebaeude.add(boden);

                    const wandDicke = 0.45;
                    const seitenLinks = new THREE.Mesh(
                        new THREE.BoxGeometry(wandDicke, h, d),
                        wandMaterial
                    );
                    seitenLinks.position.set(-w/2, h/2, 0);
                    const seitenRechts = seitenLinks.clone();
                    seitenRechts.position.x = w/2;

                    const rueckwand = new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, wandDicke),
                        wandMaterial
                    );
                    rueckwand.position.set(0, h/2, -d/2);

                    // Vorderwand mit 3 m breiter Türöffnung.
                    const tuerBreite = Math.min(3.2, w * 0.38);
                    const frontBreite = (w - tuerBreite) / 2;
                    const frontLinks = new THREE.Mesh(
                        new THREE.BoxGeometry(frontBreite, h, wandDicke),
                        wandMaterial
                    );
                    frontLinks.position.set(-(tuerBreite/2 + frontBreite/2), h/2, d/2);

                    const frontRechts = frontLinks.clone();
                    frontRechts.position.x = tuerBreite/2 + frontBreite/2;

                    const tuerRahmen = new THREE.Mesh(
                        new THREE.BoxGeometry(tuerBreite, 0.55, wandDicke),
                        wandMaterial
                    );
                    tuerRahmen.position.set(0, h - 0.275, d/2);

                    [seitenLinks,seitenRechts,rueckwand,frontLinks,frontRechts,tuerRahmen].forEach(wand => {
                        wand.position.y += 0;
                        wand.updateMatrixWorld(true);
                        // Wände werden als Weltobjekte registriert und anschließend korrekt auf die Gebäudeposition gesetzt.
                        wand.position.x += x;
                        wand.position.z += z;
                        wand.updateMatrixWorld(true);
                        registriereWand(wand);
                    });

                    // Die bereits registrierten Wände liegen direkt in szenerieGruppe.
                    // Dach mit kleiner Öffnung/Überhang, damit man das Gebäude klar erkennt.
                    const dach = new THREE.Mesh(
                        new THREE.BoxGeometry(w+0.6, 0.35, d+0.6),
                        new THREE.MeshLambertMaterial({color:0x383a38})
                    );
                    dach.position.set(x, h+0.175, z);
                    szenerieGruppe.add(dach);

                    // Fenster als dunkle Flächen.
                    for(const side of [-1,1]) {
                        const fenster = new THREE.Mesh(
                            new THREE.BoxGeometry(0.06, 1.5, 2.2),
                            new THREE.MeshBasicMaterial({color:0x111820})
                        );
                        fenster.position.set(x + side*(w/2+0.04), 2.1, z-1.2);
                        fenster.rotation.y = Math.PI/2;
                        szenerieGruppe.add(fenster);
                    }
                }
            }

            if(daten.objekt === "stadt") {
                // Zusätzliche Innenräume: Trennwände lassen kleine Zimmer und Verstecke entstehen.
                for(let i=0;i<8;i++) {
                    const x=zufall(i+3000)*170-85;
                    const z=zufall(i+3100)*170-85;
                    if(Math.abs(x)<15 && Math.abs(z)<15) continue;
                    const w=11+zufall(i+3200)*3;
                    const d=9+zufall(i+3300)*3;
                    const h=6+zufall(i+3400)*3;

                    // Zweite Etage nur bei einem Teil der Häuser.
                    if(i%2===0) {
                        const deck=new THREE.Mesh(
                            new THREE.BoxGeometry(w-0.8,0.28,d-0.8),
                            new THREE.MeshLambertMaterial({color:0x3c3d3a})
                        );
                        deck.position.set(x,h/2,z);
                        szenerieGruppe.add(deck);

                        // Außentreppe zur zweiten Etage.
                        baueTreppe(x+w*0.28,z+d*0.25,h/2,1);
                    }

                    // Innere Trennwand mit Durchgang.
                    const partition=new THREE.Mesh(
                        new THREE.BoxGeometry(0.35,h,Math.max(2.0,d*0.48)),
                        new THREE.MeshLambertMaterial({color:0x555651})
                    );
                    partition.position.set(x,h/2,z-d*0.12);
                    partition.updateMatrixWorld(true);
                    registriereWand(partition);

                    // Tür sichtbar im Eingang.
                    baueTuer(x+w/2+0.12,0,z,2.4,2.8,Math.PI/2); 
                }
            }

            if(daten.objekt === "kueste") {
                const water = new THREE.Mesh(
                    new THREE.PlaneGeometry(95,260),
                    new THREE.MeshLambertMaterial({color:0x1e6f91, transparent:true, opacity:0.82})
                );
                water.rotation.x = -Math.PI/2;
                water.position.set(75,0.03,0);
                szenerieGruppe.add(water);
            }

            if(daten.objekt === "vulkan") {
                const lava = new THREE.Mesh(
                    new THREE.PlaneGeometry(35,90),
                    new THREE.MeshLambertMaterial({color:0x7a2117})
                );
                lava.rotation.x = -Math.PI/2;
                lava.position.set(-70,0.04,0);
                szenerieGruppe.add(lava);
            }

            // Authentischere Landmarken und Deckungen je nach Einsatzgebiet.
            if(daten.objekt === "urwald") {
                for(let i=0;i<12;i++) {
                    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.65,7,8), new THREE.MeshLambertMaterial({color:0x3b2818}));
                    log.rotation.z = Math.PI/2;
                    log.position.set(zufall(i+1000)*190-95,0.55,zufall(i+1100)*190-95);
                    szenerieGruppe.add(log);
                }
            }
            if(daten.objekt === "wueste") {
                for(let i=0;i<10;i++) {
                    const cactus = new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.5,2.8+zufall(i+1200)*2,7), new THREE.MeshLambertMaterial({color:0x3d6b35}));
                    cactus.position.set(zufall(i+1300)*210-105,1.5,zufall(i+1400)*210-105);
                    szenerieGruppe.add(cactus);
                }
            }
            if(daten.objekt === "sumpf") {
                for(let i=0;i<14;i++) {
                    const pond = new THREE.Mesh(new THREE.CircleGeometry(2+zufall(i+1500)*3,20), new THREE.MeshLambertMaterial({color:0x244c42}));
                    pond.rotation.x=-Math.PI/2;
                    pond.position.set(zufall(i+1600)*210-105,0.035,zufall(i+1700)*210-105);
                    szenerieGruppe.add(pond);
                }
            }
            if(daten.objekt === "fels") {
                for(let i=0;i<8;i++) {
                    const cliff = new THREE.Mesh(new THREE.ConeGeometry(5+zufall(i+1800)*6,12+zufall(i+1900)*12,6), new THREE.MeshLambertMaterial({color:0x4a4540}));
                    cliff.position.set(zufall(i+2000)*220-110,6,zufall(i+2100)*220-110);
                    szenerieGruppe.add(cliff);
                }
            }
            if(daten.objekt === "stadt") {
                for(let i=0;i<10;i++) {
                    const rubble = new THREE.Mesh(new THREE.BoxGeometry(2+zufall(i+2200)*3,0.7,2+zufall(i+2300)*3), new THREE.MeshLambertMaterial({color:0x3f403d}));
                    rubble.position.set(zufall(i+2400)*210-105,0.35,zufall(i+2500)*210-105);
                    rubble.rotation.y=zufall(i+2600)*Math.PI;
                    szenerieGruppe.add(rubble);
                }
            }

            // Straße/Fluchtweg in jeder Mission, aber passend zur Umgebung.
            const road = new THREE.Mesh(
                new THREE.PlaneGeometry(18,240),
                new THREE.MeshLambertMaterial({color:
                    daten.objekt === "schnee" ? 0x9da5a5 :
                    daten.objekt === "wueste" ? 0x6e5436 : 0x514d3f})
            );
            road.rotation.x = -Math.PI/2;
            road.position.y = 0.02;
            szenerieGruppe.add(road);

            // Missionsabhängige Deckungen.
            for(let i=0; i<12; i++) {
                const base = new THREE.Mesh(
                    new THREE.BoxGeometry(5+Math.random()*3,2.2,5+Math.random()*3),
                    new THREE.MeshLambertMaterial({color:
                        daten.objekt === "schnee" ? 0x687276 :
                        daten.objekt === "stadt" ? 0x62605a : 0x566052})
                );
                const building = new THREE.Group();
                building.add(base);
                base.position.y = 1.1;
                building.position.set(zufall(i+900)*190-95,0,Math.random()*190-95);
                szenerieGruppe.add(building);
            }
        }

        baueSzenerie(1);

        camera.position.set(0, 2, 0);
        let rotationX = 0;
        let rotationY = 0;

        // --- SOLDATEN / GEGNER SYSTEM ---
        let gegnerArray = [];
        const missionsziele = [
            {typ:"eliminieren", name:"Eliminiere alle Gegner"},
            {typ:"ueberleben", name:"Überlebe den Angriff für"},
            {typ:"erreichen", name:"Erreiche den markierten Bereich"}
        ];
        let aktuellesZiel = null;
        let zielZeit = 0;
        let zielZone = null;
        let missionAbgeschlossen = false;

        function erstelleSoldat() {
            const soldier = new THREE.Group();

            const uniformMat = new THREE.MeshLambertMaterial({ color: 0x3d5137 });
            const darkMat = new THREE.MeshLambertMaterial({ color: 0x202622 });
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xc58b68 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.65, 0.65), uniformMat);
            body.position.y = 1.65;
            soldier.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 10), skinMat);
            head.position.y = 2.75;
            soldier.add(head);

            const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.48, 12, 8, 0, Math.PI*2, 0, Math.PI/2), darkMat);
            helmet.position.y = 2.95;
            soldier.add(helmet);

            let leftLeg, rightLeg, leftArm, rightArm;
            for(const side of [-1,1]) {
                const leg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.35, 0.42), darkMat);
                leg.position.set(side*0.3, 0.55, 0);
                soldier.add(leg);
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.32, 1.25, 0.32), uniformMat);
                arm.position.set(side*0.82, 1.75, 0);
                arm.rotation.z = side * 0.22;
                soldier.add(arm);
                if(side === -1) { leftLeg = leg; leftArm = arm; }
                else { rightLeg = leg; rightArm = arm; }
            }

            // Gewehr in den Händen
            const rifle = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 1.9), darkMat);
            rifle.position.set(0.52, 1.65, -0.75);
            rifle.rotation.x = Math.PI/2;
            soldier.add(rifle);

            // Explizite Körperteile für saubere Animationen
            soldier.userData.parts = {
                body, head, helmet, uniformMat,
                leftLeg, rightLeg, leftArm, rightArm, rifle
            };
            soldier.userData.parts.leftLeg.name = "leftLeg";
            soldier.userData.parts.rightLeg.name = "rightLeg";
            soldier.userData.parts.leftArm.name = "leftArm";
            soldier.userData.parts.rightArm.name = "rightArm";
            soldier.userData.parts.rifle.name = "rifle";
            return soldier;
        }

        function erstelleGegner(anzahl) {
            gegnerArray.forEach(g => scene.remove(g.mesh));
            gegnerArray = [];

            for(let i=0; i<anzahl; i++) {
                const mesh = erstelleSoldat();
                mesh.position.set(Math.random()*120 - 60, 0, Math.random()*120 - 60);
                const distance = mesh.position.distanceTo(camera.position);
                if(distance < 15) mesh.position.z -= 25;
                scene.add(mesh);
                const verhalten = ["angreifer", "scharfschuetze", "flanker", "verteidiger"][Math.floor(Math.random()*4)];
                gegnerArray.push({
                    mesh,
                    material: mesh.userData.parts.uniformMat,
                    hp: 100 + (spieler.mission * 20),
                    maxHp: 100 + (spieler.mission * 20),
                    flashTimer: 0,
                    attackCooldown: Math.random()*1.5,
                    animTime: Math.random()*10,
                    walkPhase: Math.random()*Math.PI*2,
                    dying: false,
                    deathTime: 0,
                    muzzleTime: 0,
                    shotCooldown: 1.0 + Math.random()*2.5,
                    verhalten,
                    spawnPosition: mesh.position.clone(),
                    strafeDir: Math.random() < 0.5 ? -1 : 1,
                    strafeTimer: 1 + Math.random()*2,
                    lastPlayerShot: 0,
                    shootAnimTime: 0,
                    shootRecoil: 0,
                    entdeckt: false,
                    entdeckungsZeit: 0
                });
            }
            ausgebenUI();
        }

        // --- STEUERUNG ---
        let moveInput = { x: 0, y: 0 };
        let lookInput = { x: 0, y: 0 };

        document.getElementById('move-stick').addEventListener('touchmove', (e) => {
            let touch = e.touches[0];
            let rect = e.target.getBoundingClientRect();
            moveInput.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            moveInput.y = -(((touch.clientY - rect.top) / rect.height) * 2 - 1);
        });
        document.getElementById('move-stick').addEventListener('touchend', () => moveInput = { x: 0, y: 0 });

        document.getElementById('look-stick').addEventListener('touchmove', (e) => {
            let touch = e.touches[0];
            let rect = e.target.getBoundingClientRect();
            lookInput.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            lookInput.y = -(((touch.clientY - rect.top) / rect.height) * 2 - 1);
        });
        document.getElementById('look-stick').addEventListener('touchend', () => lookInput = { x: 0, y: 0 });

        document.getElementById('fire-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            feuerWaffe();
        });

        function feuerWaffe() {
            playShootSound();
            // Kleine Rückstoßanimation der Kamera
            rotationX = Math.min(Math.PI/3, rotationX + 0.025);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            
            const intersects = raycaster.intersectObjects(gegnerArray.map(g => g.mesh), true);
            
            if(intersects.length > 0) {
                let getroffenMesh = intersects[0].object;
                let gegner = gegnerArray.find(g => g.mesh === getroffenMesh || g.mesh.getObjectById(getroffenMesh.id));
                
                if(gegner) {
                    playHitSound();
                    gegner.hp -= aktuelleWaffe.schaden;
                    gegner.mesh.userData.parts.uniformMat.color.setHex(0xffffff); // Treffer-Feedback
                    gegner.flashTimer = 0.1;
                    
                    if(gegner.hp <= 0 && !gegner.dying) {
                        // Todesanimation statt sofortigem Entfernen
                        gegner.dying = true;
                        gegner.deathTime = 0;
                        gegner.mesh.userData.deathAwarded = false;
                    }
                }
            }
            ausgebenUI();
        }

        function neuesMissionsziel() {
            missionAbgeschlossen = false;
            if(zielZone) {
                scene.remove(zielZone);
                zielZone = null;
            }

            aktuellesZiel = missionsziele[(spieler.mission - 1) % missionsziele.length];

            if(aktuellesZiel.typ === "ueberleben") {
                zielZeit = 18 + spieler.mission * 3;
            }

            if(aktuellesZiel.typ === "erreichen") {
                const zone = new THREE.Group();
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(4, 5, 32),
                    new THREE.MeshBasicMaterial({color:0x00ff66, side:THREE.DoubleSide, transparent:true, opacity:0.75})
                );
                ring.rotation.x = -Math.PI / 2;
                const beacon = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.18, 0.18, 6, 8),
                    new THREE.MeshBasicMaterial({color:0x00ff66})
                );
                beacon.position.y = 3;
                zone.add(ring, beacon);
                zone.position.set(Math.random()*170-85, 0.04, Math.random()*170-85);
                zielZone = zone;
                scene.add(zone);
            }
            ausgebenUI();
        }

        function missionErfolgreich() {
            if(missionAbgeschlossen) return;
            missionAbgeschlossen = true;
            playWinSound();
            spieler.credits += 200;
            const alteMission = spieler.mission;

            if(spieler.mission < 10) {
                spieler.mission++;
                setTimeout(() => {
                    alert("Mission " + alteMission + " abgeschlossen! +200$. Neues Missionsziel: " + missionsziele[(spieler.mission - 1) % missionsziele.length].name + ".");
                    starteMission();
                }, 50);
            } else {
                setTimeout(() => {
                    alert("Glückwunsch! Alle 10 Missionen geschafft! +200$. Die Kampagne beginnt erneut.");
                    spieler.mission = 1;
                    starteMission();
                }, 50);
            }
        }

        function ueberpruefeMission() {
            if(!aktuellesZiel || missionAbgeschlossen) return;

            if(aktuellesZiel.typ === "eliminieren" && gegnerArray.length === 0) {
                missionErfolgreich();
            }

            if(aktuellesZiel.typ === "ueberleben" && zielZeit <= 0) {
                missionErfolgreich();
            }

            if(aktuellesZiel.typ === "erreichen" && zielZone) {
                const d = camera.position.distanceTo(zielZone.position);
                if(d < 5.5) missionErfolgreich();
            }
        }

        function starteMission() {
            baueSzenerie(spieler.mission);
            camera.position.set(0, 2, 0);
            rotationX = 0;
            rotationY = 0;
            if(zielZone) {
                scene.remove(zielZone);
                zielZone = null;
            }
            const gegnerAnzahl = 2 + spieler.mission;
            erstelleGegner(gegnerAnzahl);
            neuesMissionsziel();
        }

        function ausgebenUI() {
            document.getElementById('hp-val').innerText = spieler.hp;
            document.getElementById('credits-val').innerText = spieler.credits;
            document.getElementById('weapon-val').innerText = aktuelleWaffe.name;
            document.getElementById('cover-status').innerText = spielerIstInGebaeude() ? '🛡️ IN DECKUNG' : '';
            document.getElementById('mission-num').innerText = spieler.mission;
            if(aktuellesZiel) {
                if(aktuellesZiel.typ === "ueberleben") {
                    const rest = Math.max(0, Math.ceil(zielZeit));
                    document.getElementById('objective-text').innerText = aktuellesZiel.name + " " + rest + "s";
                } else if(aktuellesZiel.typ === "eliminieren") {
                    document.getElementById('objective-text').innerText = aktuellesZiel.name + " (" + gegnerArray.length + " übrig)";
                } else {
                    document.getElementById('objective-text').innerText = aktuellesZiel.name;
                }
            }
        }


        function renderLevelMenu() {
            const grid=document.getElementById('level-grid');
            grid.innerHTML="";
            missionsSzenerien.forEach((m,i)=>{
                const card=document.createElement('div');
                card.className='level-card';
                card.innerHTML='<b>Level '+(i+1)+': '+m.name+'</b><br><small>Einsatzgebiet: '+m.name+'</small>';
                const btn=document.createElement('button');
                btn.textContent='LEVEL '+(i+1)+' STARTEN';
                btn.onclick=function(){ spieler.mission=i+1; spieler.hp=100; starteMission(); toggleLevelMenu(); };
                card.appendChild(btn);
                grid.appendChild(card);
            });
        }
        function toggleLevelMenu() {
            const menu=document.getElementById('level-menu');
            const open=menu.style.display==='block';
            menu.style.display=open?'none':'block';
            if(!open) renderLevelMenu();
        }
        document.getElementById('level-btn').addEventListener('click',toggleLevelMenu);

        function toggleShop() {
            const menu = document.getElementById('shop-menu');
            const sichtbar = menu.style.display === 'block';
            menu.style.display = sichtbar ? 'none' : 'block';
            if(!sichtbar) renderShop();
        }
        document.getElementById('shop-btn').addEventListener('click', toggleShop);

        function renderShop() {
            const list = document.getElementById('shop-list');
            list.innerHTML = "";
            waffenListe.forEach(w => {
                let div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <span><b>${w.name}</b> (Schaden: ${w.schaden})</span>
                    <span>${w.gekauft ? 'Bereits im Besitz' : w.preis + '$'} 
                    <button class="buy-btn" onclick="kaufeWaffe(${w.id})">${w.gekauft && aktuelleWaffe.id === w.id ? 'Ausgewählt' : (w.gekauft ? 'Auswählen' : 'Kaufen')}</button></span>
                `;
                list.appendChild(div);
            });
        }

        window.kaufeWaffe = function(id) {
            let waffe = waffenListe.find(w => w.id === id);
            if(waffe.gekauft) {
                aktuelleWaffe = waffe;
            } else if(spieler.credits >= waffe.preis) {
                spieler.credits -= waffe.preis;
                waffe.gekauft = true;
                aktuelleWaffe = waffe;
            } else {
                alert("Nicht genug Credits!");
            }
            toggleShop();
            ausgebenUI();
        }

        // --- GAME LOOP ---
        const velocity = new THREE.Vector3();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if(spieler.lastDamageTime > 0) {
                spieler.lastDamageTime -= delta;
                document.getElementById('hud').style.transform = Math.sin(spieler.lastDamageTime * 55) * 3 + 'px';
            } else {
                document.getElementById('hud').style.transform = 'translateX(0)';
            }

            rotationY -= lookInput.x * 0.03;
            rotationX += lookInput.y * 0.03;
            rotationX = Math.max(-Math.PI/3, Math.min(Math.PI/3, rotationX));
            camera.quaternion.setFromEuler(new THREE.Euler(rotationX, rotationY, 0, 'YXZ'));

            const vorherX = camera.position.x;
            const vorherZ = camera.position.z;
            velocity.set(moveInput.x, 0, -moveInput.y).normalize();
            velocity.applyQuaternion(camera.quaternion);
            velocity.y = 0;
            camera.position.addScaledVector(velocity, delta * 12);

            // Türen öffnen/schließen automatisch, wenn der Spieler sich nähert.
            aktualisiereTueren();

            // Gebäude haben echte Wände und Türen. Durch Wände kann man nicht laufen.
            korrigiereGebaeudeKollision(vorherX, vorherZ);

            // Unsichtbare Grenzen der Spielwelt: der Spieler kann die Szenerie nicht verlassen.
            const weltGrenze = 126;
            camera.position.x = Math.max(-weltGrenze, Math.min(weltGrenze, camera.position.x));
            camera.position.z = Math.max(-weltGrenze, Math.min(weltGrenze, camera.position.z));
            if(!aktualisiereTreppen()) camera.position.y = 2;

            if(aktuellesZiel && aktuellesZiel.typ === "ueberleben" && !missionAbgeschlossen) {
                zielZeit -= delta;
            }

            ueberpruefeMission();

            gegnerArray.forEach(g => {
                // Treffer-Blinken zurücksetzen
                if(g.flashTimer > 0) {
                    g.flashTimer -= delta;
                    if(g.flashTimer <= 0) g.material.color.setHex(0x3d5137);
                }

                // Unterschiedliche KI-Verhalten
                g.animTime += delta;

                const parts = g.mesh.userData.parts;
                const walk = Math.sin(g.animTime * (5.5 + spieler.mission * 0.1) + g.walkPhase) * 0.55;

                // Treffer-Blinken zurücksetzen
                if(g.flashTimer > 0) {
                    g.flashTimer -= delta;
                    if(g.flashTimer <= 0) g.material.color.setHex(0x3d5137);
                }

                // Todesanimation
                if(g.dying) {
                    g.deathTime += delta;
                    const t = Math.min(g.deathTime / 0.65, 1);
                    g.mesh.rotation.x = -t * Math.PI * 0.48;
                    g.mesh.position.y = -0.45 * t;

                    if(t >= 1 && !g.mesh.userData.deathAwarded) {
                        g.mesh.userData.deathAwarded = true;
                        scene.remove(g.mesh);
                        gegnerArray = gegnerArray.filter(x => x !== g);
                        spieler.credits += 50 * spieler.mission;
                        if(aktuellesZiel && aktuellesZiel.typ === "eliminieren") ueberpruefeMission();
                    }
                    return;
                }

                // Laufanimation
                if(parts.leftArm && parts.rightArm) {
                    parts.leftArm.rotation.z = -0.22 + walk * 0.45;
                    parts.rightArm.rotation.z = 0.22 - walk * 0.45;
                }
                if(parts.leftLeg && parts.rightLeg) {
                    parts.leftLeg.rotation.x = walk * 0.65;
                    parts.rightLeg.rotation.x = -walk * 0.65;
                }

                let richtung = new THREE.Vector3().subVectors(camera.position, g.mesh.position);
                richtung.y = 0;
                const dist = richtung.length();

                // Soldaten bleiben zunächst an ihrem Spawnpunkt.
                // Sie entdecken den Spieler erst, wenn er in ihrer Sichtweite ist.
                if(!g.entdeckt && dist < 42) {
                    const blickrichtung = new THREE.Vector3();
                    camera.getWorldDirection(blickrichtung);
                    blickrichtung.y = 0;
                    if(blickrichtung.lengthSq() > 0.01) blickrichtung.normalize();

                    const zumSoldaten = g.mesh.position.clone().sub(camera.position);
                    zumSoldaten.y = 0;
                    if(zumSoldaten.lengthSq() > 0.01) {
                        zumSoldaten.normalize();
                        const sichtwinkel = blickrichtung.dot(zumSoldaten);

                        // Der Soldat entdeckt den Spieler nur bei freier Sicht.
                        const soldatAuge = g.mesh.position.clone();
                        soldatAuge.y += 1.45;
                        const spielerZiel = camera.position.clone();
                        spielerZiel.y = 1.4;
                        const freieSicht = istSichtkontakt(soldatAuge, spielerZiel);

                        if(freieSicht && (sichtwinkel > 0.45 || dist < 12)) {
                            g.entdeckt = true;
                            g.entdeckungsZeit = 0;
                        }
                    }
                }

                // Noch nicht entdeckt: stehen bleiben und nur leicht atmen.
                if(!g.entdeckt) {
                    g.mesh.position.copy(g.spawnPosition);
                    g.mesh.rotation.y = Math.sin(g.animTime * 0.4 + g.walkPhase) * 0.12;
                    return;
                }

                // Verhalten 1: Angreifer - rennt direkt auf den Spieler zu
                // Verhalten 2: Scharfschütze - hält Abstand und schießt aus der Distanz
                // Verhalten 3: Flanker - versucht seitlich um den Spieler herumzukommen
                // Verhalten 4: Verteidiger - bleibt eher bei seinem Startgebiet und greift dort an
                let ziel = new THREE.Vector3();

                if(g.verhalten === "angreifer") {
                    ziel.copy(camera.position);
                    if(dist > 6) {
                        richtung.normalize();
                        g.mesh.position.addScaledVector(richtung, delta * (2.0 + spieler.mission * 0.12));
                    }
                } else if(g.verhalten === "scharfschuetze") {
                    if(dist < 16) {
                        richtung.normalize();
                        g.mesh.position.addScaledVector(richtung, -delta * 1.0);
                    } else if(dist > 28) {
                        richtung.normalize();
                        g.mesh.position.addScaledVector(richtung, delta * 0.8);
                    } else {
                        // Kleine seitliche Positionsänderungen, damit der Scharfschütze nicht stillsteht
                        const side = new THREE.Vector3(-richtung.z, 0, richtung.x).multiplyScalar(g.strafeDir);
                        g.strafeTimer -= delta;
                        if(g.strafeTimer <= 0) {
                            g.strafeDir *= -1;
                            g.strafeTimer = 1.5 + Math.random()*2;
                        }
                        g.mesh.position.addScaledVector(side, delta * 0.35);
                    }
                } else if(g.verhalten === "flanker") {
                    const side = new THREE.Vector3(-richtung.z, 0, richtung.x).multiplyScalar(g.strafeDir);
                    if(dist > 10) {
                        richtung.normalize();
                        ziel.copy(richtung).multiplyScalar(0.55).add(side.normalize().multiplyScalar(0.8)).normalize();
                        g.mesh.position.addScaledVector(ziel, delta * 1.55);
                    } else {
                        g.strafeTimer -= delta;
                        if(g.strafeTimer <= 0) {
                            g.strafeDir *= -1;
                            g.strafeTimer = 1 + Math.random()*1.5;
                        }
                        g.mesh.position.addScaledVector(side.normalize(), delta * 1.0 * g.strafeDir);
                    }
                } else {
                    // Verteidiger: bewegt sich nur begrenzt vom Spawnpunkt weg
                    const homeDir = new THREE.Vector3().subVectors(g.spawnPosition, g.mesh.position);
                    if(homeDir.length() > 9) {
                        homeDir.normalize();
                        g.mesh.position.addScaledVector(homeDir, delta * 1.2);
                    } else if(dist < 13) {
                        richtung.normalize();
                        g.mesh.position.addScaledVector(richtung, -delta * 0.8);
                    }
                }

                // Erst nach der Entdeckung darf der Soldat den Spieler verfolgen.
                const lookDir = new THREE.Vector3().subVectors(camera.position, g.mesh.position);
                lookDir.y = 0;
                if(lookDir.lengthSq() > 0.01) {
                    g.mesh.rotation.y = Math.atan2(lookDir.x, lookDir.z);
                }

                // Waffenhaltung: nah = Anschlag, sonst normale Laufhaltung
                const schussReichweite = g.verhalten === "scharfschuetze" ? 42 :
                                         g.verhalten === "verteidiger" ? 30 : 24;

                const soldatAugeFuerSchuss = g.mesh.position.clone();
                soldatAugeFuerSchuss.y += 1.45;
                const spielerZielFuerSchuss = camera.position.clone();
                spielerZielFuerSchuss.y = 1.4;
                const schussSicht = istSichtkontakt(soldatAugeFuerSchuss, spielerZielFuerSchuss);

                if(g.entdeckt && dist < schussReichweite && schussSicht) {
                    if(parts.leftArm && parts.rightArm) {
                        parts.leftArm.rotation.z = -0.72;
                        parts.rightArm.rotation.z = 0.72;
                    }
                    if(parts.leftLeg && parts.rightLeg) {
                        parts.leftLeg.rotation.x = 0;
                        parts.rightLeg.rotation.x = 0;
                    }

                    // Soldaten schießen jetzt wirklich auf den Spieler.
                    g.shotCooldown -= delta;
                    if(g.shotCooldown <= 0 && dist > 5) {
                        const cooldownBase = g.verhalten === "scharfschuetze" ? 2.2 :
                                             g.verhalten === "angreifer" ? 1.0 : 1.5;
                        g.shotCooldown = cooldownBase + Math.random()*1.2;
                        g.muzzleTime = 0.16;
                        g.shootAnimTime = 0.16;
                        g.shootRecoil = 0;
                        playShootSound();

                        const flash = new THREE.Mesh(
                            new THREE.SphereGeometry(0.13, 6, 6),
                            new THREE.MeshBasicMaterial({color: 0xffcc55})
                        );
                        flash.position.set(0.52, 1.65, -1.72);
                        g.mesh.add(flash);
                        g.muzzleFlash = flash;

                        if(parts.rifle) parts.rifle.position.z = -0.94;
                        // sichtbare Schussbewegung: Arme ziehen die Waffe kurz zurück
                        if(parts.leftArm && parts.rightArm) {
                            parts.leftArm.rotation.z = -0.82;
                            parts.rightArm.rotation.z = 0.82;
                        }

                        // Trefferchance abhängig vom Soldatentyp und der Entfernung.
                        const accuracyBase = g.verhalten === "scharfschuetze" ? 0.88 :
                                             g.verhalten === "angreifer" ? 0.48 : 0.65;
                        const distancePenalty = Math.min(dist / 70, 0.30);
                        const hitChance = Math.max(0.25, accuracyBase - distancePenalty);

                        if(Math.random() < hitChance) {
                            const damage = g.verhalten === "scharfschuetze" ? 12 :
                                           g.verhalten === "angreifer" ? 7 : 9;
                            spieler.hp = Math.max(0, spieler.hp - damage);
                            spieler.lastDamageTime = 0.18;
                            playPlayerHitSound();
                            ausgebenUI();

                            if(spieler.hp <= 0) {
                                spieler.hp = 0;
                                ausgebenUI();
                                setTimeout(() => {
                                    if(spieler.hp <= 0) {
                                        alert("Du wurdest von den Soldaten eliminiert! Die Mission startet neu.");
                                        spieler.hp = 100;
                                        starteMission();
                                        ausgebenUI();
                                    }
                                }, 250);
                            }
                        }
                    }

                    if(g.shootAnimTime > 0) {
                        g.shootAnimTime -= delta;
                        const p = Math.max(0, g.shootAnimTime / 0.16);
                        const kick = Math.sin((1 - p) * Math.PI) * 0.18;
                        if(parts.rifle) parts.rifle.position.z = -0.75 - kick;
                        if(parts.leftArm && parts.rightArm) {
                            parts.leftArm.rotation.z = -0.72 - kick * 0.7;
                            parts.rightArm.rotation.z = 0.72 + kick * 0.7;
                        }
                    }

                    if(g.muzzleTime > 0) {
                        g.muzzleTime -= delta;
                        if(g.muzzleFlash) {
                            g.muzzleFlash.scale.setScalar(1 + Math.random()*0.7);
                            g.muzzleFlash.visible = true;
                        }
                        if(g.muzzleTime <= 0) {
                            if(g.muzzleFlash) {
                                g.mesh.remove(g.muzzleFlash);
                                g.muzzleFlash = null;
                            }
                            if(parts.rifle) parts.rifle.position.z = -0.75;
                        }
                    }
                }

                // Nahkampfschaden nur bei sehr kurzer Distanz
                if(g.entdeckt && dist < 2.2) {
                    g.attackCooldown -= delta;
                    if(g.attackCooldown <= 0) {
                        spieler.hp = Math.max(0, spieler.hp - 4);
                        g.attackCooldown = 1.0;
                        playPlayerHitSound();
                        ausgebenUI();

                        if(spieler.hp <= 0) {
                            alert("Du wurdest im Nahkampf eliminiert! Die Mission startet neu.");
                            spieler.hp = 100;
                            starteMission();
                            ausgebenUI();
                        }
                    }
                }
            });

            renderer.render(scene, camera);
        }

        starteMission();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
